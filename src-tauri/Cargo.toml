[package]
name = "forex-terminal"
version = "0.1.0"
description = "Forex Terminal — Tauri + Next.js + OpenCode + bot MT5 embarque"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
